<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Prognoza pogody</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <h1>Sprawdź pogodę</h1>

        <div class="search-box">
            <label for="city-input">Podaj miasto lub adres:</label>
            <div class="row">
                <input 
                    type="text" 
                    id="city-input" 
                    placeholder="np. Warszawa, London, 00-001"
                >
                <button id="weather-btn">Pogoda</button>
            </div>
        </div>

        <section class="results">
            <div class="current-weather">
                <h2>Pogoda bieżąca</h2>
                <p class="placeholder">
                    Tutaj pojawią się dane o aktualnej pogodzie.
                </p>
            </div>

            <div class="forecast">
                <h2>Prognoza na 5 dni</h2>
                <p class="placeholder">
                    Tutaj pojawi się prognoza z API 5 day / 3 hour forecast.
                </p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
