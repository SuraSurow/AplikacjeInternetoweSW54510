<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Pogoda</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>What’s heatin’ up?</h1>

        <div class="search-box">
            <label for="city-input">Podaj miasto</label>
            <div class="row">
                <input 
                    type="text" 
                    id="city-input" 
                    placeholder="np. Warsaw ( po angielsku !!!)"
                >
                <button id="weather-btn">Pogoda</button>
            </div>
        </div>

        <section class="results">
            <div class="current-weather">
                <h2>Pogoda Na Teraz</h2>
                <p class="placeholder">
                    Tu sie pojawi pogoda na teraz
                </p>
            </div>

            <div class="forecast">
                <h2>Pogoda na 5 dni</h2>
                <p class="placeholder">
                    Tu pojawi sie pogoda 5-dniowa
                </p>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
